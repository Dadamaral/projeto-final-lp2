<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiário</title>
    <script src="Bestiario.js" defer></script>
</head>
<body>
    <div class="hero">
        <img src="../site/assets/img/Hero-Bestiario.png" alt="Imagem da Hero da página Bestiário">
        <h1>Bestiário Mitológico</h1>
        <h2>Conheça as feras lendárias que desafiaram heróis e deuses</h2>
    </div>
    <div class="Sessão-categoria">
        <button onclick="filtrarBestas('Todas')">Todas</button>
        <button onclick="filtrarBestas('Bestas')">Bestas</button>
        <button onclick="filtrarBestas('Marítimos')">Marítimos</button>
        <button onclick="filtrarBestas('Místicos')">Místicos</button>
        <button onclick="filtrarBestas('Colossos')">Colossos</button>
    </div>
    <div class="lista-bestas">
        <img src="../site/assets/img/Livro-Bestiario.png" alt="Imagem do Livro 'Mitologia'">
        <h2>Gostaria de saber mais sobre as criaturas e monstros da Mitologia Grega?</h2>
        <p>Adquira o livro físico ou virtual disponível em nosso site através da sessão de produtos</p>
    </div>
</body>
</html>
